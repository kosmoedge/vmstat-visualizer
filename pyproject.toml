[project]
name = "vmstat-visualizer"
version = "0.1.0"
description = "A python CLI tool that visualizes vmstat output."
authors = [
    {name = "nikfot",email = "nik_fot@hotmail.gr"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click (>=8.2.1,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
